# Auto Props Engine — Powered by FN CREATIVE
ENABLE_LOGGING=1
DATABASE_PATH=/data/props/database/device_db.txt

# Detik. 0 = tidak ditahan timer. 21600=6h · 43200=12h · 86400=24h
ROTATE_INTERVAL=86400

# 1 = jalankan /data/props/ai_selector.sh sebelum manual/rotasi DB (rotasi DB tetap menimpa model jika aktif)
CALL_AI_SELECTOR=0

# 0 = jangan jalankan hardware_selector. 1 = jalankan sh /data/props/hardware_selector.sh (default: aktif)
CALL_HARDWARE_SELECTOR=1
